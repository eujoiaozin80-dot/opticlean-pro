<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with #2026 color -->
  <circle cx="128" cy="128" r="120" fill="#2026"/>
  
  <!-- Byte Latency Logo Design -->
  <g fill="white">
    <!-- B letter for Byte -->
    <rect x="40" y="60" width="20" height="136" rx="4"/>
    <rect x="40" y="60" width="60" height="20" rx="4"/>
    <rect x="40" y="96" width="50" height="20" rx="4"/>
    <rect x="40" y="132" width="60" height="20" rx="4"/>
    
    <!-- L letter for Latency -->
    <rect x="120" y="60" width="20" height="136" rx="4"/>
    <rect x="120" y="176" width="60" height="20" rx="4"/>
    
    <!-- Speed lines representing latency -->
    <rect x="200" y="80" width="40" height="3" rx="1.5" opacity="0.8"/>
    <rect x="190" y="96" width="50" height="3" rx="1.5" opacity="0.6"/>
    <rect x="180" y="112" width="60" height="3" rx="1.5" opacity="0.4"/>
    <rect x="170" y="128" width="70" height="3" rx="1.5" opacity="0.3"/>
    <rect x="160" y="144" width="80" height="3" rx="1.5" opacity="0.2"/>
  </g>
  
  <!-- Subtle glow effect -->
  <circle cx="128" cy="128" r="118" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>
</svg>
